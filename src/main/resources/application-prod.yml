# Entorno PROD: despliegues (Google Cloud Run + Cloud SQL, o Railway + plugin MySQL).
# Sin valores por defecto para secretos: falla al arrancar si faltan (fail-fast).
# La plataforma inyecta PORT automáticamente (Cloud Run y Railway).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}

logging:
  level:
    root: INFO
    com.regisoc: INFO

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:1800000}

management:
  endpoints:
    web:
      exposure:
        include: health
