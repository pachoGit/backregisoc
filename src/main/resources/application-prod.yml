# Entorno PROD: despliegues (Google Cloud Run + Cloud SQL, o Railway + plugin MySQL).
# Sin valores por defecto para secretos: falla al arrancar si faltan (fail-fast).
# Variables obligatorias en prod: JWT_SECRET + conexión a BD, de una de estas formas:
#   a) DB_URL + DB_USERNAME + DB_PASSWORD (Cloud SQL, URL JDBC completa), o
#   b) MYSQLHOST + MYSQLPORT + MYSQLDATABASE + MYSQLUSER + MYSQLPASSWORD
#      (inyectadas automáticamente por el plugin MySQL de Railway).
# La plataforma inyecta PORT automáticamente (Cloud Run y Railway).
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://${MYSQLHOST:${MYSQL_HOST:localhost}}:${MYSQLPORT:${MYSQL_PORT:3306}}/${MYSQLDATABASE:${MYSQL_DATABASE:regisoc}}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:${DB_USER:${MYSQLUSER:${MYSQL_USER:root}}}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:}}}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}

logging:
  level:
    root: INFO
    com.regisoc: INFO

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:1800000}

management:
  endpoints:
    web:
      exposure:
        include: health
