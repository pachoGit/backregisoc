# Entorno DEV: ambiente de desarrollo compartido (MySQL).
# Uso:
#   ./gradlew bootRunDev
#   SPRING_PROFILES_ACTIVE=dev ./gradlew bootRun
# Por defecto usa la BD `regisoc_dev` en localhost (creada por docker/mysql/init.sql);
# contra el servidor de desarrollo real, define DB_URL/DB_USERNAME/DB_PASSWORD en `.env`.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/regisoc_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:${DB_USER:root}}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  flyway:
    enabled: true

logging:
  level:
    root: INFO
    com.regisoc: INFO
