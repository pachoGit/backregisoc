# Configuración común a todos los entornos.
# Los valores varían por perfil (local/test/prod) y por variables de entorno.
# Ver .env.example para la lista completa de variables soportadas.
spring:
  application:
    name: regisoc
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  # Cloud Run inyecta PORT. En local se usa 8080 salvo SERVER_PORT/PORT.
  port: ${PORT:${SERVER_PORT:8080}}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:1800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
