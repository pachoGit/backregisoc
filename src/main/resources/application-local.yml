# Entorno LOCAL: desarrollo en tu máquina con MySQL (docker-compose) o H2.
# Uso:
#   ./gradlew bootRunLocal            -> MySQL localhost:3306 (ver docker-compose.yml)
#   SPRING_PROFILES_ACTIVE=local ./gradlew bootRun
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/regisoc?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:${DB_USER:root}}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true

logging:
  level:
    root: INFO
    com.regisoc: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: INFO
